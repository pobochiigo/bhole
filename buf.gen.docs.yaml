# Optional HTML reference for the proto schemas. Requires protoc-gen-doc on PATH:
#   go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest
#   buf generate --template buf.gen.docs.yaml
# Output lands in docs/proto, which is gitignored.
version: v1
plugins:
  - name: doc
    out: docs/proto
    opt: html,index.html
    # Run the plugin once over every proto file so the single index.html covers
    # all services; the default per-directory strategy would emit one file per
    # package and buf would keep only the first.
    strategy: all
